# Growth follow-up system configuration.
# Edit this file, then restart the scheduler (`python run.py loop`) and the dashboard.

timezone: Asia/Kolkata
database: data/growth.db

working_hours:
  start: "10:00"
  end: "18:30"
  days: [Mon, Tue, Wed, Thu, Fri]

# The GM's hourly routine. It is listed in the morning note, and at the start of each block every GM
# gets a short nudge with their live queue counts (nudge: false skips it, e.g. for lunch).
# Built around the 4-hour NPC rule: numbers dialled 10:00-13:00 come back 14:00-17:00 the same day.
day_structure:
  - { time: "10:00", block: "Huddle with your SM (15 min): morning note, yesterday's misses, market notes. Then clear every overdue / carry-over follow-up" }
  - { time: "11:00", block: "🔥 Hot and 🌤️ warm clients first: research-active and order-attempt clients while the market is open" }
  - { time: "12:00", block: "Fresh sign-ups (registered 0-7 days, no deposit): first calls and welcome / onboarding" }
  - { time: "13:00", block: "Lunch", nudge: false }
  - { time: "14:00", block: "NPC round 1: morning not-picked-up numbers come back now (4 h rule), plus promised callbacks due" }
  - { time: "15:00", block: "App-activity and turned-hot follow-ups (deposit failed, order abandoned, research calls) before market close at 15:30" }
  - { time: "16:00", block: "Going cold: 8-30 day no-deposit clients and dormant traders back in the app (re-activation)" }
  - { time: "17:00", block: "NPC round 2 and evening callbacks: clients whose best time to call is the evening" }
  - { time: "18:00", block: "Wrap-up: log every disposition, set promised times, clear overdue before the 18:30 EOD report" }

rules:
  # These are defaults. Once the admin saves the "Admin: rules" page, those values take over.
  npc_retry_hours: 4            # not picked up -> resurface the lead this many hours later (GMs cannot change it)
  max_npc_attempts: 6           # after this many consecutive NPCs the lead is marked unreachable
  first_call_sla_minutes: 120   # a newly assigned lead must get its first call within this window
  warning_after_minutes: 15     # overdue by this much -> warning to the caller
  escalate_after_minutes: 60    # overdue by this much -> escalated to the manager, counted as a miss
  stale_after_days: 3           # open lead with no contact for this long -> system follow-up
  sync_interval_minutes: 5      # how often `run.py loop` syncs sources and checks follow-ups
  default_followup_hours: 24    # spoke to them but no time agreed: follow up again after this
  not_interested_revisit_days: 7  # 'Not interested': one more try after this; a second 'not interested' closes
  unreachable_revisit_days: 7   # after the NPC limit: one more round after this; unreachable again closes
  minutes_per_call: 5           # a GM's pace: bulk first calls are spaced this far apart, highest priority first

sources:
  leads:
    # csv            -> a local .csv/.xlsx file (path)
    # gsheet_csv_url -> a Google Sheet "File > Share > Publish to web" CSV link (url)
    # gsheet         -> a private Google Sheet read with a service account (spreadsheet_key, worksheet, service_account_json)
    type: csv
    path: data/leads.csv
    url: ""
    spreadsheet_key: ""
    worksheet: ""
    service_account_json: secrets/service_account.json
    # Map your sheet's column headers to the fields the system uses. Only lead_id OR phone is required.
    columns:
      lead_id: "Lead ID"
      we_user_id: "WebEngage User ID"   # used to join app activity; falls back to lead_id, then phone/email
      name: "Name"
      phone: "Phone"
      email: "Email"
      category: "Category"
      source: "Source"
      remarks: "Remarks"
      # Optional: carry over follow-ups already recorded in the sheet when a lead is first imported.
      last_call_status: "Last Call Status"
      last_call_at: "Last Call Time"
      next_followup_at: "Next Follow-up"
    npc_statuses: ["NPC", "Not Picked", "Not Picked Up", "No Answer", "Busy", "Switched Off"]

  # New clients with no first deposit, from the back-office SQL Server (read-only).
  # Runs only where the server is reachable (office network): `python run.py pull-clients`.
  client_db:
    enabled: true
    server: "192.168.0.181"    # back-office SQL Server (SQL login via CLIENT_DB_USER / CLIENT_DB_PASSWORD env vars)
    database: Repl_TargetReview
    driver: ODBC Driver 18 for SQL Server
    trust_server_certificate: true
    # Windows login is used by default. For a SQL login set CLIENT_DB_USER and CLIENT_DB_PASSWORD,
    # or put a full ODBC connection string in CLIENT_DB_CONN.
    new_clients_query: |
      SELECT
          C.CLIENT_ID,
          C.REGISTRATION_DATE,
          DATEDIFF(DAY, C.REGISTRATION_DATE, GETDATE()) AS DaysSinceRegistration
      FROM [Repl_TargetReview].[dbo].[tbl_ClientNew] C
      LEFT JOIN [Repl_TargetReview].[dbo].[tbl_ClientFtdLtd] F
          ON C.CLIENT_ID = F.CLIENT_ID
      WHERE
          C.REGISTRATION_DATE >= DATEADD(DAY, -{window_days}, CAST(GETDATE() AS DATE))
          AND (
              F.FirstDepositDate IS NULL
              OR F.FirstDeposit IS NULL
              OR F.FirstDeposit <= 0
          )
      ORDER BY
          DaysSinceRegistration ASC;
    # Clients who have deposited recently: their open leads are closed as converted.
    deposits_query: |
      SELECT F.CLIENT_ID, F.FirstDeposit, F.FirstDepositDate
      FROM [Repl_TargetReview].[dbo].[tbl_ClientFtdLtd] F
      WHERE F.FirstDeposit > 0
        AND F.FirstDepositDate >= DATEADD(DAY, -45, CAST(GETDATE() AS DATE));
    # Customer list → "Get the client list": each list type's clients come from these read-only queries.
    # No deposit uses new_clients_query above. Low margin and re-activation have built-in queries (first deposit under the
    # funding target; last trade between reactivation.churn_min_days and churn_max_days ago); set low_margin_query /
    # reactivation_query here to override. Payouts need payout_query (must return CLIENT_ID); until then upload the list.
    payout_query: ""
    centralised_default: true   # "Get the client list" starts on centralised clients only (see `centralised` below)

  webengage:
    folder: data/webengage    # drop WebEngage CSV/XLSX exports here; each file is loaded once
    # Leave blank to auto-detect common WebEngage header names.
    user_id_column: ""
    event_name_column: ""
    event_time_column: ""
    # Rows that are WebEngage totals or placeholders, not real clients.
    ignore_client_ids: ["Others", "(not set)", "null", "NA", "Total"]
    # Category is always the client-database ageing (New - no deposit 0-7 days, Traded - dormant...). What a list is
    # (new / re-activation / payout) is the List column, chosen when an SM uploads it.
    file_categories: {}

# Map your WebEngage event names to the signals the system understands.
signals:
  app_open: ["DASHBOARD_OPENED_MOB", "App Opened", "Session Started", "app_open", "App Launched"]
  kyc_started: ["KYC Started", "kyc_started"]
  kyc_complete: ["KYC Completed", "kyc_completed", "Account Activated"]
  deposit_initiated: ["Add Funds Clicked", "Deposit Initiated", "deposit_initiated"]
  deposit_failed: ["Deposit Failed", "Payment Failed", "deposit_failed"]
  deposit_success: ["Deposit Successful", "Funds Added", "deposit_success"]
  instrument_viewed: ["Stock Viewed", "Scrip Viewed", "Instrument Viewed", "stock_viewed"]
  watchlist_add: ["Added To Watchlist", "watchlist_add"]
  order_abandoned: ["Order Window Closed", "Order Abandoned", "order_abandoned"]
  trade_placed: ["ORDER_PLACED_MOB", "Order Placed", "Trade Executed", "order_placed"]
  research_call_accepted: ["CALL_ACCEPTED_MOB"]
  research_viewed: ["RECOMMENDATION_LISTING_OPENED_MOB", "RECOMMENDATION_LANDING_SCREEN_MOB"]

# Signals that create a system follow-up for an open lead (when nothing is already pending).
triggers:
  deposit_failed: "Deposit failed in the app: help them complete it"
  deposit_initiated: "Started adding funds but did not finish"
  order_abandoned: "Opened an order window but did not place it"
  kyc_complete: "KYC just completed: push for the first deposit"
  deposit_success: "Funds added: guide them to their first trade"

# Heat score (0-100) from app activity: decides who gets called first.
# Per activity:  weight (core / non-core)  x  recency (halves every `recency_half_life_days`)
#                x  frequency (1 + log2(times done), capped at `frequency_cap`)
# The sum is mapped onto 0-100 with  100 x (1 - e^(-sum / score_scale)).
heat:
  high_holdings: 100000                 # holdings at or above this (₹) are flagged as a "High-value" lever
  core_weight: 10
  non_core_weight: 3
  recency_half_life_days: 3
  # Hourly recency (WebEngage pivots are hourly). "hourly": recency from the hours since last done, blending the slow
  # half-life above with a fast one, and each hour's repeats decayed by their own age; "last_seen": the old day-level rule.
  recency_mode: last_seen               # hourly is built and tested; switch on once the "hours ago" clock is decided
  fast_half_life_hours: 6               # the "active right now" part: 1 h ago 0.97, 20 h ago 0.60, 3 days ago 0.35
  fast_share: 0.3                       # weight of the fast part (0 = the old curve)
  active_days_window: 7                 # day-level engagement: distinct active days in the last N days...
  active_days_bonus: 0.3                # ...active every day adds up to +30% to the activity points
  frequency_cap: 4
  app_history_weight: 0.25             # uploaded app-history score: heat = stronger of (live app, history) + this x the other
  score_scale: 35                      # tuned on the 4-7 Oct file: ~17% hot, ~14% warm
  lookback_days: 30
  tiers: { hot: 70, warm: 40 }          # score >= 70 is hot, >= 40 warm, otherwise cold
  first_call_sla_minutes: { hot: 30, warm: 120, cold: 240 }
  # Activities that count as core when the file has no "Activity Type" column (event names or signal names).
  # Everything else (e.g. DASHBOARD_OPENED_MOB, RECOMMENDATION_LANDING_SCREEN_MOB) is non-core.
  # REGISTERED is the registration date from the client database: a fresh sign-up adds core points.
  core_activities: [REGISTERED, ORDER_PLACED_MOB, CALL_ACCEPTED_MOB, RECOMMENDATION_LISTING_OPENED_MOB,
                    kyc_started, kyc_complete, deposit_initiated, deposit_failed, deposit_success,
                    order_abandoned, trade_placed, watchlist_add]
  # Users in an activity file who are not in the lead sheet become leads, keyed by their ClientCode.
  create_leads_from_activity: true
  require_phone_for_new_leads: false
  new_lead_category: "Not yet matched in client DB"   # until the client database has been looked up

# Payout lists (uploaded on Customer list with "Customers doing a payout"): money is leaving, so every customer goes
# to a GM, first in line. The retention pitch never delays or discourages the withdrawal.
# Centralised client: the business "Vertical" rule (payout and funding reports). A direct client (IsDirect = 1; partnership
# clients never are) whose Sub_Branch_Code is one of these or starts with one of the prefixes. Used by the activation
# lists, payouts and the referral drive.
centralised:
  direct_only: true
  sub_branches: [BPL, SHRSHP, GO, PUSS, HRN, HOBR, HORET, G-ZSM2, G-ZSM1, G-ASM1, G-ASM2, PUDS, PUVT, TB, TELE, GOVPD]
  prefixes: [DT]

payout:
  first_call_minutes: 30
  # "Get the client list" for payouts: a payout of more than share_of_balance of the balance just before it, in the last
  # pull_days. Balance = pay-ins minus payouts over balance_days (back-office ledger, FA_TRANSACTIONS).
  share_of_balance: 0.25
  pull_days: 7
  balance_days: 365

# Re-activation lists (uploaded on Customer list with "Re-activation customers"): low hit rate, so they reach a GM
# only once their app activity puts them in one of these heat tiers. Until then they wait in a "watching" pool.
reactivation:
  assign_tiers: [hot, warm]
  churn_min_days: 90     # "Get the client list" for re-activation: last trade at least this many days ago...
  churn_max_days: 365    # ...and no more than this many

# Map your sheet's categories to a lifecycle stage so the right playbook is used.
# Stages: kyc_pending, kyc_no_deposit, funded_no_trade, dormant_trader, active_trader.
# Unmapped categories fall back to a stage inferred from app activity.
category_stage:
  "Registered - KYC pending": kyc_pending
  "KYC done - No deposit": kyc_no_deposit
  "Funded - No trade": funded_no_trade
  "Dormant trader": dormant_trader
  "New - no deposit (0-7 days)": kyc_no_deposit
  "New - no deposit (8-15 days)": kyc_no_deposit
  "New - no deposit (16-30 days)": kyc_no_deposit
  "No deposit (31-90 days)": kyc_no_deposit
  "No deposit (90+ days)": kyc_no_deposit
  "Deposited - no trade yet": funded_no_trade
  "Traded - dormant (30+ days)": dormant_trader
  "Traded - active (last 30 days)": active_trader

team:
  # DUMMY TEAM for now: replace with the real people before go-live.
  # role: gm  = Growth Manager, does the calling and gets leads (capacity = max open leads)
  #       sm  = Service Manager, mentors their GMs, receives escalations and team reports
  # sm:   the id of the GM's Service Manager
  # categories: optional; GMs listed against a lead category get those leads first.
  - { id: sm_01, name: SM 01 (dummy), role: sm, title: Service Manager, email: "" }
  - { id: sm_02, name: SM 02 (dummy), role: sm, title: Service Manager, email: "" }
  - { id: gm_01, name: GM 01 (dummy), role: gm, title: Growth Manager, sm: sm_01, capacity: 50, email: "" }
  - { id: gm_02, name: GM 02 (dummy), role: gm, title: Growth Manager, sm: sm_01, capacity: 50, email: "" }
  - { id: gm_03, name: GM 03 (dummy), role: gm, title: Growth Manager, sm: sm_01, capacity: 50, email: "" }
  - { id: gm_04, name: GM 04 (dummy), role: gm, title: Growth Manager, sm: sm_02, capacity: 50, email: "" }
  - { id: gm_05, name: GM 05 (dummy), role: gm, title: Growth Manager, sm: sm_02, capacity: 50, email: "" }

notifications:
  outbox_dir: data/outbox       # every notification is also written here and shown in the dashboard
  email:
    enabled: false
    smtp_host: smtp.gmail.com
    smtp_port: 587
    username: ""
    password_env: SMTP_PASSWORD # read the password from this environment variable
    from_address: ""
  webhook_url: ""               # optional Slack / Google Chat incoming webhook for alerts

# Prioritised customer list with scores, levers and pitch, published on a schedule.
outputs:
  csv_path: data/exports/customer_priority.csv   # always written (local runs)
  export_every_minutes: 60                        # how often the scheduler refreshes the sheet
  google_sheet:
    enabled: false               # true once the sheet is shared with the service account (see DEPLOY.md, step 6)
    spreadsheet_key: ""          # the long id in the sheet URL: docs.google.com/spreadsheets/d/<THIS>/edit
    customers_tab: Customers
    service_account_json: secrets/service_account.json   # local key file; in the cloud use GOOGLE_SERVICE_ACCOUNT_JSON

# Friendlier names for WebEngage events in the sheet and pitches (anything unlisted is tidied automatically).
activity_labels:
  ORDER_PLACED_MOB: Placed an order
  CALL_ACCEPTED_MOB: Accepted a Sarthi idea
  RECOMMENDATION_LISTING_OPENED_MOB: Opened Sarthi ideas
  RECOMMENDATION_LANDING_SCREEN_MOB: Visited Sarthi home
  DASHBOARD_OPENED_MOB: Opened the app dashboard

# Live market notes, refreshed by the scheduler and sanity-checked (NSE vs Yahoo, ranges, freshness).
# Headlines are kept only when they are macro / market-wide; anything that reads like a stock tip is dropped.
market:
  enabled: true
  refresh_minutes: 15

# Offers GMs mention. Keep these exactly in line with the published tariff and services (compliance-approved wording).
offers:
  pricing_line: "discount brokerage pricing, comparable with Groww and Zerodha, with Sarthi ideas and alerts included"
  rm_line: "a dedicated Relationship Manager (RM) to help them manage their trades"
  # Hinglish versions used in the GM's call ideas
  pricing_line_hi: "Pricing Groww aur Zerodha jaisi discount wali hai, aur Sarthi ideas + alerts saath mein included hain"
  rm_line_hi: "ek dedicated Relationship Manager (RM) milega, jo trades manage karne mein help karega"
  # When the RM is offered proactively: pitch stages, plus high_value (holdings at or above heat.high_holdings)
  rm_for_stages: [dormant_trader, active_trader, high_value]

# Swastika propositions GMs stack on a call, matched to the customer. Add your own (IPO, MTF, mutual funds, account
# offers...) with compliance-approved wording. "for": pitch stages it suits (kyc_no_deposit, funded_no_trade,
# dormant_trader, active_trader, payout) or "all"; "segments": optional Equity / F&O / Commodity filter.
propositions:
  - name: Sarthi trade ideas
    for: [all]
    pitch_hi: "Sarthi ready trade ideas deta hai: entry, target, stop-loss ke saath. Research ki tension nahi, faisla aapka"
  - name: Discount brokerage
    for: [kyc_no_deposit, funded_no_trade, dormant_trader, payout, referral]
    pitch_hi: "Brokerage Groww / Zerodha jaisi discount wali, upar se Sarthi ideas aur alerts included"
  - name: Recommendations and alerts
    for: [kyc_no_deposit, funded_no_trade, dormant_trader, active_trader]
    pitch_hi: "Market alerts aur recommendations seedha app pe aate hain, kuch miss nahi hoga"
  - name: Dedicated RM
    for: [dormant_trader, active_trader, payout]
    pitch_hi: "Trades manage karna mushkil lage toh dedicated Relationship Manager (RM) saath rahega"

# Referral asks: our most active traders (cash + F&O trades, last `days` days; query: sources.client_db.referral_query,
# default in wepipeline/referral.py) are thanked and asked for a referral. They sit beside the funding work: each GM gets
# `daily_per_gm` of them per day on top of capacity, called after the market closes.
referral:
  buckets: [Very High, High, Medium]  # ActivityBucket values that get a referral ask (Very High >= 100, High >= 50, Medium >= 20 trades)
  days: 60                      # look-back for the trade count
  daily_per_gm: 5               # referral asks per GM per day (Admin: rules can change it)
  cooldown_days: 60             # a client is asked at most once in this window (Admin: rules)
  call_from: "15:45"            # after the market close: active traders are busy while it's open
  refresh_hours: 24             # re-pull most active traders + referral history this often (scheduler / dashboard open)
  max_attempts: 3               # NPCs before a referral ask is dropped (no second round: these are good clients)
  scope: central                # who the drive targets: central (see `centralised`) / non_central / all
  reward_referrer: 0            # ₹ to the client who refers (e.g. 750); set on Admin: rules. 0 = no amount is quoted
  reward_friend: 0              # ₹ to the friend once they make their first trade on the app; Admin: rules
  reward_hi: ""                 # optional custom wording; blank = built from the two amounts above
  # Referral score (0-100, capped; same 🔥 ≥ 70 / 🌤️ ≥ 40 tiers as app heat). Run from the referral dashboard (port 8503).
  score:
    trades_full: 150            # trades in the window for all of trades_points (square-root curve below that)
    trades_points: 40
    days_points: 25             # trading on every trading day of the window
    recent_days: 3              # last trade within this many days...
    recent_points: 10           # ...earns these (half within a week)
    app_points: 15              # app heat 100 earns all of these (trading + app = the activity track)
    # referral-history track (0-100): how many they referred (square-root curve, all points at referrals_full)
    referrals_points: 60
    referrals_full: 5
    active_referrals_points: 40 # how many of their referrals made a first trade (all points at active_referrals_full)
    history_half_life_days: 365 # the track halves for each year since their last referral...
    history_floor: 0.5          # ...but never below half
    others_share: 0.25          # final = strongest of activity / history / campaign engagement + this share of the other two
    active_referrals_full: 3

# Sarthi activation drives (dashboard: streamlit run sarthi_app.py --server.port 8504). Target list: clients with
# Sarthi switched off in the client database (account open) who trade (trade_buckets), use the app (min_app_heat),
# or engaged with a Sarthi channel campaign. Success = Sarthi switched on (SarthiActivationDate) after the campaign started.
sarthi_activation:
  trade_buckets: [Very High, High, Medium, Low]   # trade query buckets in the target list (Low = 5+ trades in `days`)
  days: 60
  min_app_heat: 20              # app users with Sarthi off need this app heat (or any Sarthi interest) to be called
  daily_per_gm: 10              # default batch per GM when an SM starts a drive (Admin: rules)
  cooldown_days: 30             # a client is asked at most once in this window (Admin: rules)
  call_from: "10:30"
  refresh_hours: 24             # re-pull activations + traders + app users this often
  max_attempts: 3               # NPCs before an ask is dropped
  results_days: 120             # activations kept for the report

# How assertive the close is: GMs ask for the full target first, then fall back to a first step plus a set top-up time.
closing:
  fallback_amount: 10000        # first step if ₹30k isn't possible today; the rest is booked as a top-up follow-up

# OKR: an account counts as funded at this deposit. Every funding ask in the pitch aims for it, and reports count
# conversions at or above it ("Funded ≥ ₹30k").
funding_target: 30000            # default; the admin can change it on Admin: rules
registration_window_days: 30     # new clients are worked this long after registering (Admin: rules); feeds the SQL pull

# Sarthi: the hero feature in every pitch (ready trade ideas in equity, F&O, commodities). Its track record is
# entered by the admin on "Admin: rules" from official data; nothing is shown until it is entered.
sarthi:
  name: Sarthi
  # Suggested first deposit per segment for the "add funds" ask, e.g. { Equity: 5000, "F&O": 25000, Commodity: 10000, default: 5000 }.
  # Leave empty to say "an amount they're comfortable with".
  starter_amount: {}             # per-segment override of the funding ask; empty = funding_target for everyone
  track_days: 30                 # Sarthi's record is every closed idea in this many days (from tblScripOrder)

market_notes_file: data/market_notes.md

ai_pitch:
  enabled: true                 # used only when Anthropic credentials are available; otherwise rule-based pitches
  model: claude-opus-5-5
reports_dir: data/reports           # EOD reports are also saved here as Markdown
